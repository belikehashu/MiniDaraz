<div style="margin-bottom: 18px;">
  <label>First Name</label>
  <input type="text" name="first_name" required style="width:100%;padding:10px;">
</div>

<div style="margin-bottom: 18px;">
  <label>Last Name</label>
  <input type="text" name="last_name" required style="width:100%;padding:10px;">
</div>

<div style="margin-bottom: 18px;">
  <label>Email</label>
  <input type="email" name="email" required style="width:100%;padding:10px;">
</div>

<div style="margin-bottom: 18px;">
  <label>Phone</label>
  <input type="text" name="phone" required style="width:100%;padding:10px;">
</div>

<div style="margin-bottom: 18px;">
  <label>Address</label>
  <textarea name="guest_address" rows="3" required style="width:100%;padding:10px;"></textarea>
</div>

<div style="margin-bottom: 18px;">
  <label><strong>Payment Method:</strong></label><br>
  <label><input type="radio" name="payment_method" value="stripe" checked> Stripe</label>
</div>
