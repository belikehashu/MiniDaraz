{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h3>{% if form.instance.pk %}Update{% else %}Create{% endif %} Branch</h3>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">
            {% if form.instance.pk %}Update{% else %}Create{% endif %}
        </button>
    </form>
</div>
{% endblock %}
